version: "3.9"

x-common-env: &common-env
  ENV: ${ENV}
  LOG_LEVEL: ${LOG_LEVEL}
  SECRET_KEY: ${SECRET_KEY}
  DATABASE_URL: ${DATABASE_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  RESULTS_DIR: ${RESULTS_DIR}
  UPLOADS_DIR: ${UPLOADS_DIR}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *common-env
      HOST: ${HOST}
      PORT: ${PORT}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      NEUROSNAP_API_KEY: ${NEUROSNAP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"  # Temporary for Swagger UI access
    volumes:
      - results:${RESULTS_DIR}
      - uploads:${UPLOADS_DIR}
      - uploads:/storage/uploads  # New storage architecture
      - results:/storage/results  # New storage architecture
      - storage_temp:/storage/temp  # New storage architecture
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-mad.local}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-mad}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"  # Enable when SSL certificates are configured
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [appnet]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_DEMO_USER_ID: ${VITE_DEMO_USER_ID:-00000000-0000-0000-0000-000000000000}
        VITE_DEMO_USER_EMAIL: ${VITE_DEMO_USER_EMAIL:-demo@local.dev}
        VITE_DEMO_ORG_ID: ${VITE_DEMO_ORG_ID:-demo-org}
        VITE_DEMO_USER_ROLES: ${VITE_DEMO_USER_ROLES:-admin}
        VITE_DEMO_ACCESS_TOKEN: ${VITE_DEMO_ACCESS_TOKEN:-}
        VITE_DEMO_REFRESH_TOKEN: ${VITE_DEMO_REFRESH_TOKEN:-}
        VITE_ENABLE_DEMO_AUTH: ${VITE_ENABLE_DEMO_AUTH:-true}
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
      - VITE_ENABLE_DEMO_AUTH=${VITE_ENABLE_DEMO_AUTH:-true}
    depends_on:
      api:
        condition: service_healthy
      storage:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

  storage:
    build:
      context: .
      dockerfile: docker/Dockerfile.storage
    environment:
      - NGINX_USER=nginx
      - STORAGE_ROOT=/storage
    volumes:
      - uploads:/storage/uploads
      - results:/storage/results
      - storage_temp:/storage/temp
    expose:
      - "8080"
    ports:
      - "8080:8080"  # Expose storage service for external access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *common-env
      PYTHONPATH: /app:/app/database
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY}
      CELERY_PREFETCH_MULTIPLIER: ${CELERY_PREFETCH_MULTIPLIER}
      CELERY_ACKS_LATE: ${CELERY_ACKS_LATE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - results:${RESULTS_DIR}
      - uploads:${UPLOADS_DIR}
      - uploads:/storage/uploads  # New storage architecture
      - results:/storage/results  # New storage architecture
      - storage_temp:/storage/temp  # New storage architecture
    networks: [appnet]

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-lc", "cd database && python scripts/migrate.py --upgrade"]
    restart: "no"
    networks: [appnet]

  flower:
    image: mher/flower:1.2.0
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=user:password
    command: ["celery", "--broker=${CELERY_BROKER_URL}", "flower"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks: [appnet]

volumes:
  pgdata:
  redisdata:
  results:
  uploads:
  storage_temp:

networks:
  appnet:
